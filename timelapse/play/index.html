<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="robots" content="noindex, nofollow" />
    <!-- where the site's root is from THIS page: one folder up, since the game
         lives in play/ under the welcome page. The build emits relative URLs
         (base "./") and siteUrl resolves the rest. -->
    <meta name="site-root" content="../" />
    <title>Timelapse: Ancient Civilizations RE</title>
    <!-- shell:head -->
  </head>
  <body class="booting deep">
    <!--
      The same band the other two games and the front door carry, with this
      game's own links. The two `playway` links are the ways into the game,
      which chrome/src/play-menu.ts folds into one "Play" (Original,
      Speedrunner), as on Titanic's and Dust's pages. No "Collection": there is
      no physical release page for it.
    -->
    <header class="topbar"></header>

    <div id="stage">
      <!-- The title card and the conduit under it: the whole page until the game
           is running, a band at the top after. the page removes the image rather than
           leaving a broken frame (`brandFallback`), and the band closes up:
           the logo is decoration and the experiment is the picture below it. -->
      <div id="curtain">
        <img
          id="brand"
          src="/timelapse-logo.png"
          alt="Timelapse: Ancient Civilizations RE"
        />
        <div id="boot">
          <div id="gauge">
            <progress id="barvalue" aria-label="reading the discs" max="100" value="0"></progress>
            <div id="conduit" aria-hidden="true">
              <div id="charge" style="width: 0%"><i id="node"></i></div>
            </div>
            <div id="bootline">
              <span id="bootsay">reading the discs…</span>
              <span id="bootpct">0%</span>
            </div>
          </div>
          <!-- the gesture the AudioContext needs, asked for at the one moment
               when waiting for it costs nothing: see #start in the styles -->
          <div id="startwrap">
            <button id="start" type="button">Enter</button>
          </div>
          <!-- The gestures, taught where there is room to say them properly:
               under the button, before the picture exists. Double-tap is the one
               nobody guesses, and on this game it is what gets past a 51-second
               opening film. -->
          <p id="touchtip">
            swipe to walk and turn · double-tap for <b>esc</b>
          </p>
        </div>
      </div>
      <div id="frame">
        <!-- 1280x960, which is the engine's own 640x480 doubled: see --pic-max in
             the styles, and the plate in src/main.ts that does the doubling -->
        <canvas id="screen" width="1280" height="960"></canvas>
        <!-- the game is waiting on the network — shown by main.ts only after the
             wait is long enough to be one -->
        <div id="netbusy" hidden aria-hidden="true"><span></span></div>
      </div>
    </div>
    <div id="under">
      <div class="bar">
        <button id="fsBtn" type="button" title="Fullscreen (letterboxed 4:3)">
          ⛶ Fullscreen
        </button>
        <!-- what fullscreen does with the display's own shape (engine/src/web/stretch.ts) -->
        <label class="stretchopt" title="In fullscreen, fill the whole display instead of keeping the original 4:3 — the picture is stretched to fit"
          ><input type="checkbox" id="stretchBox" /> <span>stretch to fill</span></label
        >
        <!-- opens a prefilled GitHub issue and puts the screen on the clipboard,
             which is the only way an image reaches one (chrome/src/bug-report.ts,
             shared with the other two pages) -->
        <button
          id="bugBtn"
          type="button"
          title="Report something the port gets wrong"
        >
          🪲 Report a bug
        </button>
        <span id="bugNote" class="note"></span>
        <button id="logBtn" type="button" title="The boot log, in full (b)">
          ▤ Boot log
        </button>
        <span
          class="keyhint"
          title="←/→ turn · ↑/↓ walk · z/c back away diagonally · space opens the panel · esc skips a film · b opens the boot log"
          ><span class="k">←</span>/<span class="k">→</span> turn
          <span class="k">↑</span> walk <span class="k">space</span> panel
          <span class="k">esc</span> skip <span class="k">b</span> for the boot
          log</span
        >
        <!-- the same line for a phone, which has none of those keys. Swapped by a
             media query rather than by script, because it is a question about the
             POINTER and CSS is what knows the answer without asking. -->
        <span
          class="touchhint"
          title="swipe up to walk, left/right to turn · double-tap for escape · SPACE opens the panel"
          >swipe · <span class="k">2-tap</span> esc</span
        >
      </div>
      <!-- The GAME's own controls, and they are for a finger only: a key the
           game reads and two questions about which way a swipe means. A keyboard
           has the space bar and a mouse never reaches a gesture, so on a desktop
           this whole row is noise — see #under .bar.touchonly in the styles. -->
      <div class="bar touchonly">
        <!-- SPACE: Timelapse's interface key, and the only way to the journal and
             the camera on a machine with no keyboard. A button rather than a
             gesture, deliberately — every tap-shaped gesture left is on the
             PICTURE, where a tap the recogniser rules wrongly opens whatever was
             underneath it, and the panel is not somewhere to arrive by accident. -->
        <button
          id="spacekey"
          type="button"
          title="the interface panel: journal, camera, saved games"
        >
          SPACE
        </button>
        <!-- Which way the two swipe axes read. Hidden until a finger is possible
             here TOO, and not only by the row: `bindSwipeInvert` unhides this and
             remembers both boxes under this game's own storage prefix, and it asks
             `maxTouchPoints` where the row asks the media query — a touchscreen
             laptop answers those two differently. -->
        <span id="swipeOpts" hidden
          ><label title="a swipe from right to left turns right, not left"
            ><input type="checkbox" id="swipeInvertTurn" /><span class="k"
              >invert ←/→</span
            ></label
          ><label title="a swipe downwards walks on, not one upwards"
            ><input type="checkbox" id="swipeInvertWalk" /><span class="k"
              >invert ↑</span
            ></label
          ></span
        >
      </div>
      <!-- Errors read as part of the controls rather than as a status line, and
           they get a row to themselves so that the row can be ABSENT: it is the
           only thing in it, and the rule above hides a row whose only child is an
           empty #err — which is almost always. -->
      <div class="bar">
        <span id="err"></span>
      </div>
      <div class="bar">
        <pre id="loc"></pre>
      </div>
    </div>
    <!-- Details, behind x (or b, or the log button): the boot's own account of
         itself, the state list and Copy details — built by
         engine/src/web/details-column.ts, the column Titanic's play page carries.
         An error opens it by itself. -->
    <div id="details" hidden></div>
    <!-- The ask, in its own element BELOW the controls strip — see the note in
         the stylesheet. An anchor in the markup rather than anything injected,
         so it is there before a script runs and visible to whatever reads the
         page. `/bmc-mark.svg` is root-absolute because Vite rewrites a
         `public/` path the MARKUP names per page depth. -->
    <footer id="foot"></footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
