<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="robots" content="noindex, nofollow" />
    <!-- where the site's root is from THIS page: one folder up, since the game
         lives in play/ under the welcome page. The build emits relative URLs
         (base "./") and siteUrl resolves the rest. -->
    <meta name="site-root" content="../" />
    <!-- shell:head -->
  </head>
  <body class="booting deep">
    <!-- The same band every page carries, with this game's mark in it. -->
    <header class="topbar"></header>

    <div id="stage">
      <!-- The title card and the gauge under it: the whole page until the game
           is running, a band at the top after. A logo that fails to load is
           removed rather than left as a broken frame (`brandFallback` in engine/src/web/page-shell.ts):
           the logo is decoration. -->
      <div id="curtain">
        <img
          id="brand"
          src="/redjack-logo.png"
          alt="RedJack: Revenge of the Brethren"
        />
        <div id="boot">
          <div id="gauge">
            <progress id="barvalue" aria-label="reading the discs" max="100" value="0"></progress>
            <div id="bar" aria-hidden="true">
              <div id="charge" style="width: 0%"></div>
            </div>
            <div id="bootline">
              <span id="bootsay">reading the discs…</span>
              <span id="bootpct">0%</span>
            </div>
          </div>
          <!-- the gesture an AudioContext needs, asked for once the disc is read -->
          <button id="start" type="button">Enter</button>
        </div>
      </div>
      <div id="frame">
        <!-- 1280x960: the engine's own 640x480, doubled (src/main.ts) -->
        <canvas id="screen" width="1280" height="960"></canvas>
        <!-- the game is waiting on the network, once the wait is long enough -->
        <div id="netbusy" hidden aria-hidden="true"><span></span></div>
      </div>
    </div>

    <div id="under">
      <div class="bar">
        <button id="fsBtn" type="button" title="Fullscreen (letterboxed 4:3)">
          ⛶ Fullscreen
        </button>
        <!-- what fullscreen does with the display's own shape (engine/src/web/stretch.ts) -->
        <label
          class="stretchopt"
          title="In fullscreen, fill the whole display instead of keeping the original 4:3 — the picture is stretched to fit"
          ><input type="checkbox" id="stretchBox" />
          <span>stretch to fill</span></label
        >
        <!-- a prefilled GitHub issue with the screen on the clipboard
             (chrome/src/bug-report.ts, shared with the other pages) -->
        <button
          id="bugBtn"
          type="button"
          title="Report something the port gets wrong"
        >
          🪲 Report a bug
        </button>
        <span id="bugNote" class="note"></span>
        <button id="logBtn" type="button" title="The boot log, in full (b)">
          ▤ Boot log
        </button>
        <!-- RedJack's own keys, off its ReadMe: the arrows move, space is the
             control panel, esc skips a film, F1 is the fight help -->
        <span
          class="keyhint"
          title="arrows move · space opens the control panel · esc skips a film · F1 fight help · b opens the boot log"
          ><span class="keycap">←</span><span class="keycap">↑</span
          ><span class="keycap">→</span><span class="keycap">↓</span> move
          <span class="keycap">space</span> panel <span class="keycap">esc</span> skip
          <span class="keycap">F1</span> help <span class="keycap">b</span> log</span
        >
        <span
          class="touchhint"
          title="drag to look round · flick up to walk on, down to back away, sideways to turn · tap a hotspot to use it · hold two fingers to zoom · double-tap for escape · SPACE opens the panel"
          >drag look · flick walk · <span class="keycap">2 fingers</span> zoom ·
          <span class="keycap">2-tap</span> esc</span
        >
      </div>
      <!-- the game's own controls for a finger: the one key a phone lacks, and
           which way a swipe reads -->
      <div class="bar touchonly">
        <button id="spacekey" type="button" title="the control panel">
          SPACE
        </button>
        <span id="swipeOpts" hidden
          ><label title="a swipe from right to left turns right, not left"
            ><input type="checkbox" id="swipeInvertTurn" /><span class="keycap"
              >invert ←/→</span
            ></label
          ><label title="a swipe downwards walks on, not one upwards"
            ><input type="checkbox" id="swipeInvertWalk" /><span class="keycap"
              >invert ↑</span
            ></label
          ></span
        >
      </div>
      <div class="bar">
        <span id="err"></span>
      </div>
      <div class="bar">
        <pre id="loc"></pre>
      </div>
    </div>
    <!-- Details, behind x (or b, or the log button): the boot's own account of
         itself, the state list and Copy details — built by
         engine/src/web/details-column.ts, the column Titanic's play page carries.
         An error opens it by itself. -->
    <div id="details" hidden></div>
    <!-- The ask, below the controls strip, so it is there on the title card
         too. `/bmc-mark.svg` is root-absolute because Vite rewrites a `public/`
         path the markup names per page depth. -->
    <footer id="foot"></footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
