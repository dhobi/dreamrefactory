name: Tests

# The gate every change crosses. Split in two because the suites are split in
# two: most of them open the CD rip under `gamefiles/`, which is not in this
# repository and never will be — so they can only run on the self-hosted runner
# that has a copy. The rest run anywhere, and that is the half a fork's pull
# request gets.

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# A new push to the same branch supersedes the run in flight. `push` to master
# is excluded from the grouping so two merges never cancel each other.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Runs on GitHub's machines, for every pull request including forks': the
  # suites that build their own fixtures with the write path (engine/src/df/*-build.ts)
  # instead of reading the game's files — or, in save-original.ts's case, read
  # the one tracked fixture in taoot/tests/data/. 159 tests.
  #
  # The list below is the INVERSE of what it covers — the ten suites that do
  # need the rip. Excluding is deliberate: a test file added later runs here by
  # default, and if it turns out to need `gamefiles/` it fails loudly and gets
  # added to this list. The other direction would have skipped it in silence.
  # ---------------------------------------------------------------------------
  portable:
    name: suites that need no game files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Automatic suites, minus the ten that read the rip
        run: |
          npx vitest run --exclude 'taoot/tests/auto/{regression,savegame,re_builtins,interp,nav,text,audio-rates,sound-channels,shp-play-order,cst-play-order}.ts'

  # ---------------------------------------------------------------------------
  # Runs on the self-hosted runner, which holds the rip. Everything the port's
  # correctness claims actually bottom out in: the full automatic suite, then
  # the playthrough.
  # ---------------------------------------------------------------------------
  full:
    name: full auto suite + playthrough
    # A fork's pull request must never reach the machine that holds the rip:
    # `pull_request` checks out the PR's head, and that head is the fork's code.
    # Same-repo branches only. (GitHub's own advice is to keep self-hosted
    # runners off public repositories entirely; this condition plus "require
    # approval for all external contributors" is what makes the pairing safe —
    # see docs/reference/ci.md.)
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, taoot-gamefiles]
    steps:
      - uses: actions/checkout@v4

      # `actions/checkout` cleans with `git clean -ffdx`, and -x takes IGNORED
      # files too — so the links below are deleted on every run and have to be
      # remade after the checkout, not before. Remaking them is instant; the 8 GB
      # they point at never moves and is never copied into the workspace.
      - name: Link the rips into the workspace
        run: |
          # TWO rips now, one per game package, because each game's build and
          # suite resolve `gamefiles/` inside their own package. The runner's
          # .env names both: TAOOT_GAMEFILES is the tree of six editions and the
          # demo, DUST_GAMEFILES the one Dust disc — which used to be a `dust/`
          # subdirectory of the first and is its own tree now.
          fail=0
          for v in TAOOT_GAMEFILES DUST_GAMEFILES; do
            eval "d=\${$v:-}"
            if [ -z "$d" ] || [ ! -d "$d" ]; then
              echo "::error::$v ($d) is not a directory. It is set in the runner's .env — see docs/reference/ci.md."
              fail=1
            fi
          done
          [ "$fail" = 0 ] || exit 1
          ln -sfn "$TAOOT_GAMEFILES" taoot/gamefiles
          ln -sfn "$DUST_GAMEFILES" dust/gamefiles
          echo "editions present: $(ls taoot/gamefiles | tr '\n' ' ')"
          echo "dust present:     $(ls dust/gamefiles | tr '\n' ' ')"

      # No setup-node here: the runner's own Node is used, so a run does not
      # re-download a toolchain onto a machine that already has one.
      - name: Report the toolchain
        run: node --version && npm --version

      - run: npm ci

      - name: Automatic suite
        run: npm test

      # Timed by ticks and gestures rather than by wall clock, so this number is
      # not a budget — it has come in anywhere from 77 s to 137 s on the same
      # green code, which is why nothing here asserts on seconds.
      - name: Playthrough
        run: npm run test:playthrough
