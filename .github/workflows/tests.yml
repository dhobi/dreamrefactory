name: Tests

# The gate every change crosses. Split in two because the suites are split in
# two: most of them open the CD rip under `gamefiles/`, which is not in this
# repository and never will be — so they can only run on the self-hosted runner
# that has a copy. The rest run anywhere, and that is the half a fork's pull
# request gets.

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# A new push to the same branch supersedes the run in flight. `push` to master
# is excluded from the grouping so two merges never cancel each other.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Runs on GitHub's machines, for every pull request including forks': the
  # suites that build their own fixtures with the write path (engine/src/df/*-build.ts)
  # instead of reading the game's files — or, in save-original.ts's case, read
  # the one tracked fixture in taoot/tests/data/. 159 tests.
  #
  # Which suites those are is no longer written here. `npm run test:portable`
  # sets NO_GAMEFILES=1, and each package's own vitest config drops the suites it
  # knows need the rip — today only Titanic has any, listed in
  # `taoot/vitest.config.ts` beside the files it names. A suite renamed in that
  # directory used to leave a stale path in this workflow; now it cannot.
  # ---------------------------------------------------------------------------
  portable:
    name: suites that need no game files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Automatic suites, minus the ones that read the rip
        run: npm run test:portable

  # ---------------------------------------------------------------------------
  # SonarQube Cloud's look at a pull request: the scan alone, on GitHub's
  # machines, without coverage — coverage is measured once a night by
  # coverage.yml, which also scans
  # master (docs/reference/ci.md#sonarqube-cloud). Not on a push to master,
  # where a scan without coverage would blank master's until the next night,
  # and not for a fork's pull request, which cannot read SONAR_TOKEN.
  # ---------------------------------------------------------------------------
  sonar:
    name: SonarQube Cloud
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # blame for every line, which is how Sonar tells new code from old
          fetch-depth: 0

      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # every file out of coverage, so the gate's coverage condition has no
          # lines to judge: without the nightly's report, Sonar's zero-coverage
          # sensor would count every new line untested and fail the gate on it
          args: -Dsonar.coverage.exclusions=**/*

  # ---------------------------------------------------------------------------
  # Runs on the self-hosted runner, which holds the rip. Everything the port's
  # correctness claims actually bottom out in: the full automatic suite, then
  # each game's machine suites, the whole game played in node.
  # ---------------------------------------------------------------------------
  full:
    # DO NOT RENAME. This string is the status check's name, and branch
    # protection requires it by that exact name — a rename makes the required
    # check never report and every pull request waits for it forever, green
    # jobs and all. (Learned the hard way: #333 renamed this to "playthroughs"
    # and blocked itself.) Its steps carry the games' names instead, where
    # that costs nothing.
    name: full auto suite + playthrough
    # A fork's pull request must never reach the machine that holds the rip:
    # `pull_request` checks out the PR's head, and that head is the fork's code.
    # Same-repo branches only. (GitHub's own advice is to keep self-hosted
    # runners off public repositories entirely; this condition plus "require
    # approval for all external contributors" is what makes the pairing safe —
    # see docs/reference/ci.md.)
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, dreamrefactory-gamefiles]
    steps:
      # Full history, because the step that picks the games diffs against the
      # base commit and the default depth of 1 does not contain it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # `actions/checkout` cleans with `git clean -ffdx`, and -x takes IGNORED
      # files too — so the links below are deleted on every run and have to be
      # remade after the checkout, not before. Remaking them is instant; the 8 GB
      # they point at never moves and is never copied into the workspace.
      - name: Link the rips into the workspace
        run: |
          tools/runner/link-rips.sh

      - name: Report the toolchain
        run: node --version && npm --version

      - run: npm ci

      # Which games' machine suites this change needs — and why the automatic
      # suite below is deliberately NOT filtered the same way. Each game's step
      # below asks this one: its own package in the diff, or `all`.
      #
      # Measured on the run that merged #333: Titanic's machine suites are
      # 73 s of this job's 168 s, and they are ONE GAME's. A change confined to another game's
      # package pays all of it for nothing. The automatic suite is ~15 s of the
      # same job — filtering that would save a fifth as much and could, if the
      # mapping were ever wrong, let a change land with its tests unrun. So the
      # suite always runs in full and only these machine suites are chosen: the
      # saving is taken where the seconds are, and the safety net stays under
      # everything.
      #
      # Conservative by construction. ONLY a change confined to game packages —
      # or to prose, which reaches nothing — narrows anything; touch `engine/`,
      # `site/`, `tools/`, a root config or a workflow and every game runs,
      # because everything depends on those.
      #
      # It decides rather than SKIPS, and that is not a style choice: a required
      # status check that never reports blocks a pull request forever with its
      # jobs green (see the note on this job's name). So the job always runs and
      # this step always exits 0 — "nothing to run" is a result, not an absence.
      - name: Which games this change needs
        id: pt
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "${BASE:-}" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "no base commit to compare against — running every game"
            echo "all=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only "$BASE" HEAD > "$RUNNER_TEMP/changed.txt"
          echo "changed files:"; sed 's/^/  /' "$RUNNER_TEMP/changed.txt"

          all=0
          games=""
          while IFS= read -r f; do
            [ -n "$f" ] || continue

            # Prose cannot reach a machine suite. One drives the rip and
            # asserts a recorded trace; neither is reachable from `docs/` or from
            # any markdown, VitePress config included. Anything that DOES read
            # this — the front-door and manifest suites read the tree — is in the
            # automatic suite above, which is never filtered, so dropping these
            # here narrows the machine suites and nothing else.
            case "$f" in
              docs/*|*.md) continue ;;
            esac

            d="${f%%/*}"
            # A file at the root, or under something that is not a package, or
            # under one every game depends on, is a change this cannot reason
            # about — so it runs all of them.
            if [ "$d" = "$f" ] || [ ! -f "$d/package.json" ] || [ "$d" = engine ] || [ "$d" = site ]; then
              echo "  -> '$f' is not confined to a game package; running every game"
              all=1
              break
            fi
            case " $games " in *" $d "*) ;; *) games="$games $d" ;; esac
          done < "$RUNNER_TEMP/changed.txt"

          if [ "$all" = 1 ]; then
            echo "all=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed game packages:${games:- none}"
          # padded, so a step can ask for ' dust ' and never match a prefix
          echo "games=$games " >> "$GITHUB_OUTPUT"

      - name: Automatic suite
        run: npm test

      # Titanic's game, headless: its machine suites play it from the boot to
      # the ending on a virtual clock, asserting a recorded state trace
      # (docs/reference/tests.md). Its rip is required, so there is no skip.
      - name: Titanic machine suites
        if: steps.pt.outputs.all == '1' || contains(steps.pt.outputs.games, ' taoot ')
        run: npm run test:machine -w taoot

      # Dust's, the same way, rung by rung from the first day to Bloodstone.
      # No skip either: without the disc the suite fails rather than report
      # rungs it never played (docs/reference/ci.md).
      - name: Dust machine suites
        if: steps.pt.outputs.all == '1' || contains(steps.pt.outputs.games, ' dust ')
        run: npm run test:machine -w dust

      # Skull Cracker's game, headless: its machine suites stand the game up in
      # node on the rip and step it frame by frame (docs/skullcracker/
      # verification.md). About twenty seconds.
      # Without the rip there is no game to stand up, so it skips like the rest.
      - name: Skull Cracker machine suites
        if: steps.pt.outputs.all == '1' || contains(steps.pt.outputs.games, ' skullcracker ')
        run: |
          if [ -d skullcracker/gamefiles/SKULL ]; then
            npm test -w skullcracker
          else
            echo "::error::no Skull Cracker rip linked — its machine suites cannot run, and a change that reaches Skull Cracker does not pass without them. Link SKULLCRACKER_GAMEFILES (docs/reference/ci.md)."
            exit 1
          fi

      # RedJack's, the same way: the shared engine stood up in node on the three
      # discs, stepped as fast as the CPU goes, with no film pixels decoded.
      - name: RedJack machine suites
        if: steps.pt.outputs.all == '1' || contains(steps.pt.outputs.games, ' redjack ')
        run: |
          if [ -f redjack/gamefiles/RJDisk1/RedJack/bootfile.boot ]; then
            npm test -w redjack
          else
            echo "::error::no RedJack rip linked — its machine suites cannot run, and a change that reaches RedJack does not pass without them. Link REDJACK_GAMEFILES (docs/reference/ci.md)."
            exit 1
          fi

      # Timelapse's: the shared engine stood up in node on the four discs and
      # played through the whole game, world by world
      # (docs/timelapse/README.md#machine-suites). About a minute.
      - name: Timelapse machine suites
        if: steps.pt.outputs.all == '1' || contains(steps.pt.outputs.games, ' timelapse ')
        run: |
          if [ -f timelapse/gamefiles/TLAPSE1/install/data/bootfile ]; then
            npm test -w timelapse
          else
            echo "::error::no Timelapse rip linked — its machine suites cannot run, and a change that reaches Timelapse does not pass without them. Link TIMELAPSE_GAMEFILES (docs/reference/ci.md)."
            exit 1
          fi

      # Lunicus's: the game ported from LUNICUS.EXE, stood up in node on the
      # disc and played from the intro to the queen, as fast as the CPU goes
      # (docs/lunicus/README.md#machine-suites). The browser playthrough is
      # ten minutes and is browser.yml's, on a `full-run-lunicus` label.
      - name: Lunicus machine suites
        if: steps.pt.outputs.all == '1' || contains(steps.pt.outputs.games, ' lunicus ')
        run: |
          if [ -f lunicus/gamefiles/LUNICUS/lunicus/lunicus.exe ]; then
            npm test -w lunicus
          else
            echo "::error::no Lunicus rip linked — its machine suites cannot run, and a change that reaches Lunicus does not pass without them. Link LUNICUS_GAMEFILES (docs/reference/ci.md)."
            exit 1
          fi

      # Jump Raven's: the game ported from RAVEN.EXE, stood up in node on the
      # disc and played from the intro to the pilot's ending — once with the
      # game set, once by the fair player that shops, mends and flies for itself.
      - name: Jump Raven machine suites
        if: steps.pt.outputs.all == '1' || contains(steps.pt.outputs.games, ' jumpraven ')
        run: |
          if [ -f jumpraven/gamefiles/RAVEN/RAVEN/RAVEN.EXE ]; then
            npm test -w jumpraven
          else
            echo "::error::no Jump Raven rip linked — its machine suites cannot run, and a change that reaches Jump Raven does not pass without them. Link JUMPRAVEN_GAMEFILES (docs/reference/ci.md)."
            exit 1
          fi
