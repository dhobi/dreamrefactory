name: Tests

# The gate every change crosses. Split in two because the suites are split in
# two: most of them open the CD rip under `gamefiles/`, which is not in this
# repository and never will be — so they can only run on the self-hosted runner
# that has a copy. The rest run anywhere, and that is the half a fork's pull
# request gets.

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# A new push to the same branch supersedes the run in flight. `push` to master
# is excluded from the grouping so two merges never cancel each other.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Runs on GitHub's machines, for every pull request including forks': the
  # suites that build their own fixtures with the write path (engine/src/df/*-build.ts)
  # instead of reading the game's files — or, in save-original.ts's case, read
  # the one tracked fixture in taoot/tests/data/. 159 tests.
  #
  # Which suites those are is no longer written here. `npm run test:portable`
  # sets NO_GAMEFILES=1, and each package's own vitest config drops the suites it
  # knows need the rip — today only Titanic has any, listed in
  # `taoot/vitest.config.ts` beside the files it names. A suite renamed in that
  # directory used to leave a stale path in this workflow; now it cannot.
  # ---------------------------------------------------------------------------
  portable:
    name: suites that need no game files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Automatic suites, minus the ones that read the rip
        run: npm run test:portable

  # ---------------------------------------------------------------------------
  # Runs on the self-hosted runner, which holds the rip. Everything the port's
  # correctness claims actually bottom out in: the full automatic suite, then
  # the playthrough.
  # ---------------------------------------------------------------------------
  full:
    # DO NOT RENAME. This string is the status check's name, and branch
    # protection requires it by that exact name — a rename makes the required
    # check never report and every pull request waits for it forever, green
    # jobs and all. (Learned the hard way: #333 renamed this to "playthroughs"
    # and blocked itself.) The step below carries the plural instead, where it
    # costs nothing.
    name: full auto suite + playthrough
    # A fork's pull request must never reach the machine that holds the rip:
    # `pull_request` checks out the PR's head, and that head is the fork's code.
    # Same-repo branches only. (GitHub's own advice is to keep self-hosted
    # runners off public repositories entirely; this condition plus "require
    # approval for all external contributors" is what makes the pairing safe —
    # see docs/reference/ci.md.)
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, dreamrefactory-gamefiles]
    steps:
      # Full history, because the step that picks the playthroughs diffs against
      # the base commit and the default depth of 1 does not contain it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # `actions/checkout` cleans with `git clean -ffdx`, and -x takes IGNORED
      # files too — so the links below are deleted on every run and have to be
      # remade after the checkout, not before. Remaking them is instant; the 8 GB
      # they point at never moves and is never copied into the workspace.
      - name: Link the rips into the workspace
        run: |
          # TWO rips now, one per game package, because each game's build and
          # suite resolve `gamefiles/` inside their own package.
          #
          # Titanic's is REQUIRED: most of the automatic suites and the whole
          # playthrough read it, and without it this job has nothing to do.
          #
          # Dust's is OPTIONAL, because its suites already skip the disc rather
          # than failing without it — `dust/tests/` passes 15 tests with no rip
          # present at all. Demanding it here was stricter than the tests are, and
          # it blocked a host that has never needed Dust's disc. Unset is a
          # WARNING with the consequence named, not an error.
          if [ -z "${TAOOT_GAMEFILES:-}" ] || [ ! -d "${TAOOT_GAMEFILES:-}" ]; then
            echo "::error::TAOOT_GAMEFILES (${TAOOT_GAMEFILES:-unset}) is not a directory."
            echo "It is set in the runner's .env — see docs/reference/ci.md."
            exit 1
          fi
          ln -sfn "$TAOOT_GAMEFILES" taoot/gamefiles
          echo "editions present: $(ls taoot/gamefiles | tr '\n' ' ')"

          if [ -n "${DUST_GAMEFILES:-}" ] && [ -d "${DUST_GAMEFILES:-}" ]; then
            ln -sfn "$DUST_GAMEFILES" dust/gamefiles
            echo "dust present:     $(ls dust/gamefiles | tr '\n' ' ')"
          else
            echo "::warning::DUST_GAMEFILES (${DUST_GAMEFILES:-unset}) is not a directory — Dust's disc-reading tests will skip. Set it in the runner's .env to cover them."
          fi

      # No setup-node here: the runner's own Node is used, so a run does not
      # re-download a toolchain onto a machine that already has one.
      - name: Report the toolchain
        run: node --version && npm --version

      - run: npm ci

      - name: Automatic suite
        run: npm test

      # Which playthroughs this change needs — and why the automatic suite above
      # is deliberately NOT filtered the same way.
      #
      # Measured on the run that merged #333: the playthrough is 73 s of this
      # job's 168 s, and it is ONE GAME's. A change confined to another game's
      # package pays all of it for nothing. The automatic suite is ~15 s of the
      # same job — filtering that would save a fifth as much and could, if the
      # mapping were ever wrong, let a change land with its tests unrun. So the
      # suite always runs in full and only the playthroughs are chosen: the
      # saving is taken where the seconds are, and the safety net stays under
      # everything.
      #
      # Conservative by construction. ONLY a change confined to game packages —
      # or to prose, which reaches nothing — narrows anything; touch `engine/`,
      # `site/`, `tools/`, a root config or a workflow and every playthrough runs,
      # because everything depends on those.
      #
      # It decides rather than SKIPS, and that is not a style choice: a required
      # status check that never reports blocks a pull request forever with its
      # jobs green (see the note on this job's name). So the job always runs and
      # this step always exits 0 — "nothing to run" is a result, not an absence.
      - name: Which playthroughs this change needs
        id: pt
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "${BASE:-}" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "no base commit to compare against — running every playthrough"
            echo "all=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only "$BASE" HEAD > "$RUNNER_TEMP/changed.txt"
          echo "changed files:"; sed 's/^/  /' "$RUNNER_TEMP/changed.txt"

          all=0
          games=""
          while IFS= read -r f; do
            [ -n "$f" ] || continue

            # Prose cannot reach a playthrough. A playthrough drives the rip and
            # asserts a recorded trace; neither is reachable from `docs/` or from
            # any markdown, VitePress config included. Anything that DOES read
            # this — the front-door and manifest suites read the tree — is in the
            # automatic suite above, which is never filtered, so dropping these
            # here narrows the playthroughs and nothing else.
            case "$f" in
              docs/*|*.md) continue ;;
            esac

            d="${f%%/*}"
            # A file at the root, or under something that is not a package, or
            # under one every game depends on, is a change this cannot reason
            # about — so it runs all of them.
            if [ "$d" = "$f" ] || [ ! -f "$d/package.json" ] || [ "$d" = engine ] || [ "$d" = site ]; then
              echo "  -> '$f' is not confined to a game package; running every playthrough"
              all=1
              break
            fi
            case " $games " in *" $d "*) ;; *) games="$games $d" ;; esac
          done < "$RUNNER_TEMP/changed.txt"

          if [ "$all" = 1 ]; then
            echo "all=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          want=""
          for g in $games; do
            [ -f "$g/vitest.playthrough.config.ts" ] && want="$want $g"
          done
          echo "changed game packages:${games:- none}"
          echo "playthroughs to run:${want:- none}"
          echo "games=$want" >> "$GITHUB_OUTPUT"

      # Timed by ticks and gestures rather than by wall clock, so this number is
      # not a budget — it has come in anywhere from 77 s to 137 s on the same
      # green code, which is why nothing here asserts on seconds.
      - name: Playthroughs
        env:
          ALL: ${{ steps.pt.outputs.all }}
          GAMES: ${{ steps.pt.outputs.games }}
        run: |
          if [ "${ALL:-}" = "1" ]; then
            # the root script fans out over every package that has one
            npm run test:playthrough
          elif [ -z "${GAMES// /}" ]; then
            echo "no playthrough is affected by this change"
          else
            for g in $GAMES; do npm run test:playthrough -w "$g"; done
          fi
