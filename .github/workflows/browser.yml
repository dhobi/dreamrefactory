name: Browser suite

# The same route as the playthrough, but through real mouse and keyboard events
# against a live dev server — so it costs what the game costs, ~39 min for a
# carried run of Titanic's. That is too long to sit on every pull request, so it
# is not on `pull_request` by default: it runs nightly, on demand, or when a PR
# is given a `full-run-<game>` label.
#
# NOTHING HERE NAMES A GAME. The game is a variable, and everything that differs
# between them is derived from it: the rip's environment variable, the Vite
# config, the package the suite is a script of. Titanic is only the DEFAULT — for
# the nightly run and for a dispatch that does not say otherwise — because it is
# the game with the long route. Adding Dust's or Skull Cracker's is a label, not
# an edit to this file.

on:
  schedule:
    # 02:00 UTC. Cron on GitHub is best-effort and can be delayed under load.
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      game:
        description: "which game's suite (a package directory)"
        required: false
        default: taoot
        type: choice
        options:
          - taoot
          - dust
          - skullcracker
      suite:
        description: "which browser suite — a script in THAT package (test:browser, test:browser:endgame, test:browser:climb, …)"
        required: false
        default: test:browser
      segments:
        description: "SEGMENTS to run (blank = the gated set)"
        required: false
        default: ""
  pull_request:
    types: [labeled]

# Per game as well as per ref: two games labelled on the same pull request are
# two different runs and must not cancel each other, which one group keyed only
# on the ref would have done.
concurrency:
  group: browser-${{ github.ref }}-${{ inputs.game || github.event.label.name || 'nightly' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser:
    name: browser suite — ${{ inputs.game || github.event.label.name || 'taoot (nightly)' }}
    # On `labeled`, only a `full-run-<game>` label starts a run — every other
    # label edit on every PR would otherwise boot a 39-minute job. Forks are
    # excluded for the same reason as in tests.yml: this runner holds the rips.
    if: >-
      github.event_name != 'pull_request' ||
      (startsWith(github.event.label.name, 'full-run-') &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, x64, dreamrefactory-gamefiles]
    timeout-minutes: 90

    env:
      # NOT 5173. The runner shares a machine with whoever owns it, and 5173 is
      # where a developer's own `npm run dev` lives — taking it would either
      # fail the run or, worse, quietly test their working tree instead of this
      # checkout. `--strictPort` makes the collision an error rather than a
      # silent hop to the next free port.
      CI_PORT: "5199"

    steps:
      - uses: actions/checkout@v4

      # The one place the trigger's shape is turned into a game, so every step
      # after this is the same three lines whichever game it is.
      - name: Which game, and which of its suites
        id: what
        env:
          LABEL: ${{ github.event.label.name }}
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            game="${LABEL#full-run-}"          # full-run-dust -> dust
          else
            game="${{ inputs.game || 'taoot' }}"   # dispatch, or the nightly default
          fi
          suite="${{ inputs.suite || 'test:browser' }}"

          # A package directory rather than a hardcoded list, so a new game is
          # nothing to this file. Both checks fail loudly here rather than as an
          # obscure npm error twenty lines later.
          if [ ! -f "$game/package.json" ]; then
            echo "::error::'$game' is not a package in this repository — a full-run-* label must name one"
            exit 1
          fi
          if ! node -e "process.exit(require('./$game/package.json').scripts?.['$suite'] ? 0 : 1)"; then
            echo "::error::$game/package.json has no '$suite' script"
            exit 1
          fi

          echo "game=$game"   >> "$GITHUB_OUTPUT"
          echo "suite=$suite" >> "$GITHUB_OUTPUT"
          echo "running $game's $suite"

      # See tests.yml: checkout's `git clean -ffdx` removes ignored files, so
      # the link is remade after it.
      - name: Link the rip into the workspace
        env:
          GAME: ${{ steps.what.outputs.game }}
        run: |
          # The runner records each rip as <GAME>_GAMEFILES in its .env, so the
          # variable to read follows from the game and this needs no table. Only
          # the one game's disc is linked: the suite drives that game's page,
          # served by its own vite.config.ts from its own directory.
          var="$(echo "$GAME" | tr '[:lower:]' '[:upper:]')_GAMEFILES"
          rip="${!var:-}"
          if [ -z "$rip" ] || [ ! -d "$rip" ]; then
            echo "::error::$var (${rip:-unset}) is not a directory — set it in the runner's .env"
            exit 1
          fi
          ln -sfn "$rip" "$GAME/gamefiles"

      - run: npm ci

      # Three hosts to satisfy, so this asks rather than assumes:
      #   * the container (tools/runner/) already carries browsers matched to the
      #     locked Playwright version, and its user has no sudo — installing
      #     would fail on apt, and would be pointless;
      #   * a bare-metal host with sudo may still be missing the system
      #     libraries, if setup-runner.sh's warm-up was skipped;
      #   * a bare-metal host without sudo can at least fetch the browser.
      - name: Ensure Playwright's Chromium
        run: |
          if [ -n "${PLAYWRIGHT_BROWSERS_PATH:-}" ] && [ -d "${PLAYWRIGHT_BROWSERS_PATH}" ]; then
            echo "browsers come from the image: $PLAYWRIGHT_BROWSERS_PATH"
          elif sudo -n true 2>/dev/null; then
            npx playwright install --with-deps chromium
          else
            npx playwright install chromium
          fi

      # `vite preview` cannot serve this: the /gamefiles middleware is a
      # `configureServer` hook (tools/vite-gamefiles.ts), which only the dev
      # server runs. The config is the game's own, because the page is.
      # Started via node directly rather than `npm run dev` so $! is vite's own
      # pid — the cleanup step kills that pid and nothing else.
      - name: Start the dev server
        env:
          GAME: ${{ steps.what.outputs.game }}
        run: |
          node node_modules/vite/bin/vite.js \
            --config "$GAME/vite.config.ts" \
            --port "$CI_PORT" --strictPort --host 127.0.0.1 \
            > "$RUNNER_TEMP/vite.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/vite.pid"
          for _ in $(seq 1 60); do
            if curl -sf "http://127.0.0.1:$CI_PORT/" >/dev/null; then
              echo "$GAME's dev server up on $CI_PORT"
              exit 0
            fi
            sleep 1
          done
          echo "::error::dev server never answered on $CI_PORT"
          cat "$RUNNER_TEMP/vite.log"
          exit 1

      - name: Run the suite
        env:
          APP_URL: http://127.0.0.1:${{ env.CI_PORT }}/
          SEGMENTS: ${{ inputs.segments }}
          SHOT_DIR: ${{ runner.temp }}/shots
          GAME: ${{ steps.what.outputs.game }}
          SUITE: ${{ steps.what.outputs.suite }}
        run: |
          # An EMPTY SEGMENTS is not the same as an unset one, and the
          # difference is a silent pass. playthrough.ts reads it with `??`, so
          # "" survives, splits to [""], filters to [] — nought segments — and
          # then exits 0 with "PASSED — 0 beats over 0 segment(s)". The blank
          # default of the `segments` input would land exactly there, so it is
          # unset here and the suite falls back to its own gated 1..27.
          if [ -z "${SEGMENTS:-}" ]; then
            unset SEGMENTS
            echo "segments: the gated set (1..27)"
          else
            echo "segments: $SEGMENTS"
          fi
          npm run "$SUITE" -w "$GAME"

      # Kill by recorded pid. Never `pkill -f vite` — on a shared machine that
      # would take the owner's dev server with it.
      - name: Stop the dev server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/vite.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/vite.pid")" 2>/dev/null || true
          fi

      # A browser failure is a picture of a wrong screen; without it the log
      # says only that a wait went unanswered.
      - name: Upload screenshots and the server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ steps.what.outputs.game }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/shots
            ${{ runner.temp }}/vite.log
          if-no-files-found: ignore
          retention-days: 14
