name: Browser suite

# The same route as the playthrough, but through real mouse and keyboard events
# against a live dev server — so it costs what the game costs, ~39 min for a
# carried run of Titanic's. That is too long to sit on every pull request, so it
# is not on `pull_request` by default: it runs nightly, on demand, or when a PR
# is given a `full-run-<game>` label.
#
# NOTHING HERE NAMES A GAME in the parts that DO the work. The game is a
# variable, and everything that differs between them is derived from it: the
# rip's environment variable, the Vite config, the package the suite is a script
# of. Two tables in the step below are the exception, and they are the exception
# on purpose:
#
#   * WHAT A GAME'S FULL RUN IS, which is not the same script in any two of them.
#     Titanic's `test:browser` is the route; Dust's is three short suites and its
#     real depth is `speedrun:legs`, the fifty-five legs off the run sheet; Skull
#     Cracker's `test:browser` is the menu alone and its page suites together are
#     `test:browser:all` (the game itself is checked headless, on every pull
#     request, in tests.yml). A single default of `test:browser` therefore ran the
#     MENU for a `full-run-skullcracker` label and reported green, and never ran
#     Dust's legs at all under any trigger but a hand-typed dispatch.
#   * WHICH CRON MEANS WHICH, because a scheduled run carries no inputs. The only
#     thing GitHub hands a schedule is the cron expression that fired it.
#
# `site/tests/nightly-suites.ts` holds both tables to the package scripts they
# name and to the `schedule:` list, so neither can rot into a 4 a.m. failure that
# says only "no such script".

on:
  schedule:
    # An hour apart, and each one is a different game's suite — see the table in
    # "Which game, and which of its suites", which is the only thing that can
    # tell them apart. An hour is far more than any of them needs (the longest is
    # Titanic's ~39 min) because cron on GitHub is best-effort and can be delayed
    # under load; when two do collide they queue rather than clash, the runner
    # taking one job at a time and the concurrency groups below being distinct.
    - cron: "0 2 * * *" # Titanic, the route
    - cron: "0 3 * * *" # Dust, the three short suites
    - cron: "0 4 * * *" # Dust, the legs
    - cron: "0 5 * * *" # Skull Cracker, the page suites
  workflow_dispatch:
    inputs:
      game:
        description: "which game's suite (a package directory)"
        required: false
        default: taoot
        type: choice
        options:
          - taoot
          - dust
          - skullcracker
      suite:
        description: "which browser suite — a script in THAT package (blank = that game's own full run; test:browser:endgame, test:browser:climb, …)"
        required: false
        default: ""
      segments:
        description: "SEGMENTS to run (blank = the gated set)"
        required: false
        default: ""
  pull_request:
    types: [labeled]

# Per game as well as per ref: two games labelled on the same pull request are
# two different runs and must not cancel each other, which one group keyed only
# on the ref would have done.
#
# And per SCHEDULE, for the same reason one step further: the four nightly runs
# share a ref and carry no inputs, so every one of them resolved to the same
# `-nightly` group — and with `cancel-in-progress` that is three suites cancelled
# by the next cron rather than three suites run. The cron expression is the only
# thing that distinguishes them here, which is why it is spelled out rather than
# derived; the step below reads the same table, and a test holds the two together.
concurrency:
  group: >-
    browser-${{ github.ref }}-${{ inputs.game || github.event.label.name
    || (github.event.schedule == '0 3 * * *' && 'dust-browser')
    || (github.event.schedule == '0 4 * * *' && 'dust-legs')
    || (github.event.schedule == '0 5 * * *' && 'skullcracker-all')
    || 'taoot-nightly' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser:
    # The third and last place the cron table appears, and the only one a reader
    # sees: without it every nightly was headed "taoot (nightly)" whichever game
    # it was actually running. site/tests/nightly-suites.ts holds all three.
    name: >-
      browser suite — ${{ inputs.game || github.event.label.name
      || (github.event.schedule == '0 3 * * *' && 'dust (nightly)')
      || (github.event.schedule == '0 4 * * *' && 'dust legs (nightly)')
      || (github.event.schedule == '0 5 * * *' && 'skullcracker (nightly)')
      || 'taoot (nightly)' }}
    # On `labeled`, only a `full-run-<game>` label starts a run — every other
    # label edit on every PR would otherwise boot a 39-minute job. Forks are
    # excluded for the same reason as in tests.yml: this runner holds the rips.
    if: >-
      github.event_name != 'pull_request' ||
      (startsWith(github.event.label.name, 'full-run-') &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, x64, dreamrefactory-gamefiles]
    timeout-minutes: 90

    env:
      # NOT 5173. The runner shares a machine with whoever owns it, and 5173 is
      # where a developer's own `npm run dev` lives — taking it would either
      # fail the run or, worse, quietly test their working tree instead of this
      # checkout. `--strictPort` makes the collision an error rather than a
      # silent hop to the next free port.
      CI_PORT: "5199"

    steps:
      - uses: actions/checkout@v7

      # The one place the trigger's shape is turned into a game, so every step
      # after this is the same three lines whichever game it is.
      - name: Which game, and which of its suites
        id: what
        env:
          LABEL: ${{ github.event.label.name }}
          SCHEDULE: ${{ github.event.schedule }}
          WANT_GAME: ${{ inputs.game }}
          WANT_SUITE: ${{ inputs.suite }}
        run: |
          # WHAT A GAME'S FULL RUN IS — the first of the two tables the header
          # names. `test:browser` is the right answer for exactly one of the three:
          # Dust's runs three short suites while its depth is the run sheet's legs,
          # and Skull Cracker's opens the menu and stops. So a `full-run-<game>`
          # label used to ask for the fullest run a game has and get its shallowest.
          full_run() {
            case "$1" in
              dust)         echo "speedrun:legs" ;;
              skullcracker) echo "test:browser:all" ;;
              *)            echo "test:browser" ;;
            esac
          }

          case "${{ github.event_name }}" in
            pull_request)
              game="${LABEL#full-run-}"            # full-run-dust -> dust
              suite=""                             # ...and its own full run
              ;;
            schedule)
              # WHICH CRON MEANS WHICH, the second table. A scheduled run carries
              # no inputs at all — the cron expression that fired is the only
              # thing GitHub hands it, so the mapping has to live somewhere, and
              # an unmapped cron is an error rather than a silent fall back to
              # Titanic. The `schedule:` list above and this case are the pair
              # site/tests/nightly-suites.ts holds together.
              case "$SCHEDULE" in
                "0 2 * * *") game=taoot;        suite=test:browser ;;
                "0 3 * * *") game=dust;         suite=test:browser ;;
                "0 4 * * *") game=dust;         suite=speedrun:legs ;;
                "0 5 * * *") game=skullcracker; suite=test:browser:all ;;
                *)
                  echo "::error::no game is mapped to the cron '$SCHEDULE' — see the table in browser.yml"
                  exit 1
                  ;;
              esac
              ;;
            *)
              game="${WANT_GAME:-taoot}"           # a dispatch, which may say neither
              suite="$WANT_SUITE"
              ;;
          esac

          # Blank means "whatever this game's full run is", which is what a label
          # wants and what a dispatch that named only the game wants.
          [ -n "$suite" ] || suite="$(full_run "$game")"

          # A package directory rather than a hardcoded list, so a new game is
          # nothing to this file. Both checks fail loudly here rather than as an
          # obscure npm error twenty lines later.
          if [ ! -f "$game/package.json" ]; then
            echo "::error::'$game' is not a package in this repository — a full-run-* label must name one"
            exit 1
          fi
          if ! node -e "process.exit(require('./$game/package.json').scripts?.['$suite'] ? 0 : 1)"; then
            echo "::error::$game/package.json has no '$suite' script"
            exit 1
          fi

          echo "game=$game"   >> "$GITHUB_OUTPUT"
          echo "suite=$suite" >> "$GITHUB_OUTPUT"
          echo "running $game's $suite"

      # See tests.yml: checkout's `git clean -ffdx` removes ignored files, so
      # the link is remade after it.
      - name: Link the rip into the workspace
        env:
          GAME: ${{ steps.what.outputs.game }}
        run: |
          # The runner records each rip as <GAME>_GAMEFILES in its .env, so the
          # variable to read follows from the game and this needs no table. Only
          # the one game's disc is linked: the suite drives that game's page,
          # served by its own vite.config.ts from its own directory.
          var="$(echo "$GAME" | tr '[:lower:]' '[:upper:]')_GAMEFILES"
          rip="${!var:-}"
          if [ -z "$rip" ] || [ ! -d "$rip" ]; then
            echo "::error::$var (${rip:-unset}) is not a directory — set it in the runner's .env"
            exit 1
          fi
          ln -sfn "$rip" "$GAME/gamefiles"

      - run: npm ci

      # Three hosts to satisfy, so this asks rather than assumes:
      #   * the container (tools/runner/) already carries browsers matched to the
      #     locked Playwright version, and its user has no sudo — installing
      #     would fail on apt, and would be pointless;
      #   * a bare-metal host with sudo may still be missing the system
      #     libraries, if setup-runner.sh's warm-up was skipped;
      #   * a bare-metal host without sudo can at least fetch the browser.
      - name: Ensure Playwright's Chromium
        run: |
          if [ -n "${PLAYWRIGHT_BROWSERS_PATH:-}" ] && [ -d "${PLAYWRIGHT_BROWSERS_PATH}" ]; then
            echo "browsers come from the image: $PLAYWRIGHT_BROWSERS_PATH"
          elif sudo -n true 2>/dev/null; then
            npx playwright install --with-deps chromium
          else
            npx playwright install chromium
          fi

      # `vite preview` cannot serve this: the /gamefiles middleware is a
      # `configureServer` hook (tools/vite-gamefiles.ts), which only the dev
      # server runs. The config is the game's own, because the page is.
      # Started via node directly rather than `npm run dev` so $! is vite's own
      # pid — the cleanup step kills that pid and nothing else.
      - name: Start the dev server
        env:
          GAME: ${{ steps.what.outputs.game }}
        run: |
          node node_modules/vite/bin/vite.js \
            --config "$GAME/vite.config.ts" \
            --port "$CI_PORT" --strictPort --host 127.0.0.1 \
            > "$RUNNER_TEMP/vite.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/vite.pid"
          for _ in $(seq 1 60); do
            if curl -sf "http://127.0.0.1:$CI_PORT/" >/dev/null; then
              echo "$GAME's dev server up on $CI_PORT"
              exit 0
            fi
            sleep 1
          done
          echo "::error::dev server never answered on $CI_PORT"
          cat "$RUNNER_TEMP/vite.log"
          exit 1

      - name: Run the suite
        env:
          APP_URL: http://127.0.0.1:${{ env.CI_PORT }}/
          SEGMENTS: ${{ inputs.segments }}
          SHOT_DIR: ${{ runner.temp }}/shots
          GAME: ${{ steps.what.outputs.game }}
          SUITE: ${{ steps.what.outputs.suite }}
        run: |
          # An EMPTY SEGMENTS is not the same as an unset one, and the
          # difference is a silent pass. playthrough.ts reads it with `??`, so
          # "" survives, splits to [""], filters to [] — nought segments — and
          # then exits 0 with "PASSED — 0 beats over 0 segment(s)". The blank
          # default of the `segments` input would land exactly there, so it is
          # unset here and the suite falls back to its own gated 1..27.
          if [ -z "${SEGMENTS:-}" ]; then
            unset SEGMENTS
            echo "segments: the gated set (1..27)"
          else
            echo "segments: $SEGMENTS"
          fi
          npm run "$SUITE" -w "$GAME"

      # Kill by recorded pid. Never `pkill -f vite` — on a shared machine that
      # would take the owner's dev server with it.
      - name: Stop the dev server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/vite.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/vite.pid")" 2>/dev/null || true
          fi

      # A browser failure is a picture of a wrong screen; without it the log
      # says only that a wait went unanswered.
      - name: Upload screenshots and the server log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-${{ steps.what.outputs.game }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/shots
            ${{ runner.temp }}/vite.log
          if-no-files-found: ignore
          retention-days: 14
