name: Coverage

# How much of the engine, and of each game's own code, the tests run: the
# badges on the README (docs/reference/ci.md#coverage).
#
# Not part of the gate. tests.yml runs only the machine suites a change
# reaches, which is right for a check and wrong for a number: a badge measured
# on a partial run would move with whatever the last merge touched. So this
# runs every suite of every game, and publishes the badge files to the
# `badges` branch, which the README's badges read through shields.io. A
# failing suite publishes nothing, so a badge is only ever a whole run's.
#
# Nightly rather than on every push: it holds the one self-hosted runner for
# about twenty minutes, which a pull request's checks would queue behind.
# 01:17 Swiss time, done before browser.yml's first nightly at 02:17; off the
# hour for the reason given there.

on:
  schedule:
    - cron: "17 1 * * *"
      timezone: "Europe/Zurich"
  workflow_dispatch:

concurrency:
  group: coverage
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  coverage:
    name: coverage
    # the runner that holds the rips, as tests.yml's full job; a schedule and a
    # manual run both check out master, so no fork's code ever reaches it
    runs-on: [self-hosted, linux, x64, dreamrefactory-gamefiles]
    steps:
      - uses: actions/checkout@v7
        with:
          # blame for every line, which is how SonarQube Cloud tells new code
          # from old (the last step)
          fetch-depth: 0

      - name: Link the rips into the workspace
        run: tools/runner/link-rips.sh

      - run: npm ci --ignore-scripts

      - name: Every suite, with coverage
        run: npm run coverage

      - name: The numbers
        run: cat coverage/summary.md >> "$GITHUB_STEP_SUMMARY"

      # One commit on a branch of its own, force-pushed: the badges' history
      # is not worth keeping, and nothing on master changes.
      - name: Publish the badges
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd coverage/badges
          git init -q -b badges
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Coverage badges for ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges

      # SonarQube Cloud's analysis of master, with the LCOV report the run
      # above just wrote (sonar-project.properties says where): coverage is
      # measured once, here, and Sonar shows the same numbers as the badges. Last,
      # so a Sonar outage never holds the badges back.
      - name: SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
