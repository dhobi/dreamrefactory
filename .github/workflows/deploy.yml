name: Deploy

# Publishing to www.danielhobi.ch/dreamrefactory.
#
# FIVE builds share that one directory, and each releases on its own tag:
#
#   site-v0.1.0        the front door and the format editors → /dreamrefactory/
#   taoot-v0.9.51      Titanic                              → /dreamrefactory/taoot/
#   dust-v0.3.1        Dust                                 → /dreamrefactory/dust/
#   timelapse-v0.1.0   Timelapse                            → /dreamrefactory/timelapse/
#   skullcracker-v0.1.0 Skull Cracker                       → /dreamrefactory/skullcracker/
#
# The documentation is the sixth thing in that tree and does NOT release on a
# tag — it goes out on any push that touches it (docs.yml → /dreamrefactory/docs/).
#
# Adding a game to this lane is four lines and nothing else, because everything
# below is driven by the TARGET NAME: `npm run build:<target>` writes
# `dist/<target>` and that directory is mirrored to `<target>/`. What is not
# automatic is the rip — the runner has none, so a freshly deployed game shows its
# "no game data" page until the host's own copy and its manifest are in place
# (tools/mkmanifest.ts).
#
# Every namespace carries its target's name, and a tag naming none of them is an
# ERROR rather than a default: the old default-to-TAOOT would take a mis-typed tag
# and ship a build under it. Each tag is checked against its own package.json,
# because the pages read their numbers from there (site/src/version.ts) and a site
# announcing a version nobody tagged is worse than a failed deploy.
#
# An ordinary push to master deploys no build. Uploading is add-and-overwrite
# only — see .github/actions/ftp-mirror, which explains why, and why that is what
# lets three builds write into one tree.
#
# The trap this leaves is `npm version`, which writes a bare `v0.9.51` that
# nothing here listens for. Pass `--no-git-tag-version` and tag by hand, which is
# the hand that knows which of the five it is.
#
# Secrets: the `dreamrefactory` environment holds FTP_USER, FTP_PASSWORD and
# FTP_PATH (the account lands in the site directory, so FTP_PATH is "."), and
# FTP_HOST falls through to the repository secret. Optional: FTP_PORT,
# FTP_INSECURE_TLS, FTP_ALLOW_PLAINTEXT. See docs/reference/deploy.md.

on:
  push:
    tags: ["site-v*", "taoot-v*", "dust-v*", "timelapse-v*", "skullcracker-v*"]
  workflow_dispatch:
    inputs:
      target:
        description: Which of the five to build and upload
        required: true
        default: site
        type: choice
        options: [site, taoot, dust, timelapse, skullcracker]

# One upload of a given TARGET at a time, and never cancel one in flight: a
# half-written mirror is a half-broken site.
#
# Per target rather than one lane for all five, because a single lane silently
# DROPS releases. GitHub keeps only the newest run pending in a concurrency
# group — `cancel-in-progress: false` protects the run that is already going,
# not the ones queued behind it — so pushing dust-v0.3.9, taoot-v0.9.55 and
# timelapse-v0.1.1 together deployed dust and cancelled the other two within two
# seconds, and the tags sat there looking released. They went out by hand.
#
# Splitting the lane is safe because the five write DISJOINT paths — each game
# into its own directory, the site into the root around them — and the upload
# only ever adds and overwrites (.github/actions/ftp-mirror is `mirror -R` with
# no --delete, deliberately). What must never overlap is two uploads of the same
# target, and that is what this group still holds.
#
# The residue: two runs of the SAME target queued at the same moment still lose
# the older one, because GitHub's queue is one deep and nothing here can make it
# deeper. That is a re-tag of one game inside a few seconds, which is a mistake
# worth noticing rather than a workflow to support; a real FIFO would mean a
# third-party wait-action in the middle of the deploy path.
concurrency:
  group: >-
    deploy-${{ inputs.target
    || (startsWith(github.ref_name, 'site-v') && 'site')
    || (startsWith(github.ref_name, 'taoot-v') && 'taoot')
    || (startsWith(github.ref_name, 'dust-v') && 'dust')
    || (startsWith(github.ref_name, 'timelapse-v') && 'timelapse')
    || (startsWith(github.ref_name, 'skullcracker-v') && 'skullcracker')
    || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: build and upload
    runs-on: ubuntu-latest
    environment: dreamrefactory
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PATH: ${{ secrets.FTP_PATH }}
      FTP_PORT: ${{ secrets.FTP_PORT }}
      FTP_INSECURE_TLS: ${{ secrets.FTP_INSECURE_TLS }}
      FTP_ALLOW_PLAINTEXT: ${{ secrets.FTP_ALLOW_PLAINTEXT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Which of the five is this? The tag says so itself; a manual dispatch
      # says so in its input.
      - name: Which release is this
        id: what
        run: |
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            target="${{ inputs.target }}"
          elif [[ "${GITHUB_REF_NAME}" == site-v*  ]]; then target=site
          elif [[ "${GITHUB_REF_NAME}" == taoot-v* ]]; then target=taoot
          elif [[ "${GITHUB_REF_NAME}" == dust-v*  ]]; then target=dust
          elif [[ "${GITHUB_REF_NAME}" == timelapse-v* ]]; then target=timelapse
          elif [[ "${GITHUB_REF_NAME}" == skullcracker-v* ]]; then target=skullcracker
          else
            echo "::error::tag $GITHUB_REF_NAME names no target — tag site-v*, taoot-v*, dust-v*, timelapse-v* or skullcracker-v*"
            exit 1
          fi
          echo "target=$target" >> "$GITHUB_OUTPUT"
          # the site's build IS the root of the tree; the games sit inside it
          [ "$target" = site ] && echo "remote=." >> "$GITHUB_OUTPUT" \
                               || echo "remote=$target" >> "$GITHUB_OUTPUT"

      - name: The tag and the package agree
        if: github.ref_type == 'tag'
        run: |
          target="${{ steps.what.outputs.target }}"
          tag="${GITHUB_REF_NAME#${target}-v}"
          pkg="$(node -p "require('./${target}/package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME says $tag, ${target}/package.json says $pkg"
            exit 1
          fi
          echo "deploying $target $pkg"

      # Each script runs tsc across the whole workspace first, so a type error
      # anywhere stops any deploy.
      - name: Build
        run: npm run build:${{ steps.what.outputs.target }}

      # A runner has no rip, so the manifest this build wrote describes almost
      # nothing. The host's copy is the real one (tools/mkmanifest.ts); this is
      # deleted here and excluded from the upload as well.
      - name: Drop the manifest this build could not write
        run: rm -f dist/${{ steps.what.outputs.target }}/gamefiles.json

      - name: Upload
        uses: ./.github/actions/ftp-mirror
        with:
          source: dist/${{ steps.what.outputs.target }}
          remote: ${{ steps.what.outputs.remote }}
          # the collection page links to ~1 GB DBGL archives that live beside the
          # rip and are in no build
          exclude: ${{ steps.what.outputs.target == 'taoot' && '--exclude-glob *.zip' || '' }}

      - name: Say what went out
        if: success()
        run: |
          target="${{ steps.what.outputs.target }}"
          url="https://www.danielhobi.ch/dreamrefactory/"
          [ "$target" = site ] || url="$url$target/"
          {
            echo "### Deployed $target \`$(node -p "require('./${target}/package.json').version")\` to <$url>"
            echo
            echo "$(find "dist/$target" -type f | wc -l) files, $(du -sh "dist/$target" | cut -f1) — added and overwritten only."
            echo "The rips, their \`gamefiles.json\`, the DBGL archives and the other two builds were not touched."
          } >> "$GITHUB_STEP_SUMMARY"
