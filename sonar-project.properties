# SonarQube Cloud (docs/reference/ci.md#sonarqube-cloud). Scanned by
# coverage.yml after its nightly run, which hands over the LCOV report it has
# just written — so coverage is measured once, and Sonar reads the same
# numbers as the badges.
sonar.organization=dhobi
sonar.projectKey=dhobi_dreamrefactory
sonar.projectName=dreamrefactory

# The code that ships: the engine, each game, the site. Not the suites, not the
# hand-run tools under `tools/`, not generated tables (`*.gen.ts`), and not
# `public/` (game data and fonts, served as they are).
sonar.sources=.
sonar.exclusions=**/tests/**,**/tools/**,tools/**,**/*.gen.ts,**/public/**,gamefiles/**,dist/**,out/**,coverage/**,docs/.vitepress/cache/**,docs/.vitepress/dist/**
sonar.tests=.
sonar.test.inclusions=**/tests/**

# What vitest.coverage.config.ts measures, and nothing it does not: a file
# outside its `include` has no line in the report, and Sonar would count it as
# untested rather than as unmeasured. The browser shell (`engine/src/web/`), the
# site, the bedsit and the minigames are reached only by browser suites.
sonar.javascript.lcov.reportPaths=coverage/vitest/lcov.info
sonar.coverage.exclusions=engine/src/web/**,site/**,docs/**,taoot/bedsit/**,taoot/minigames/**,**/*.html,**/*.css

# Each game's pages are their own copies on purpose (a page belongs to exactly
# one package), so their markup is not held to the duplication figure; the
# TypeScript behind them is.
sonar.cpd.exclusions=**/*.html

# Rules this code breaks on purpose. Switched off here rather than marked in
# the code or accepted in Sonar's UI, so each one is a decision on record:
#
# e1 S7758, Unicode-aware string methods: the strings they flag are bytes
#    (file headers, RIFF tags, packed names); codePointAt would misread them.
# e2 S9382, awaits in sequence in a loop: the order is the point (a script's
#    steps, frames handed to the encoder, files fetched one after another).
# e3 S3735, `void`: it is how a promise is deliberately left unawaited, which
#    the floating-promise rule asks for.
# e4 S7767, `| 0` to truncate: it is the original's integer conversion, which
#    wraps to 32 bits where Math.trunc does not.
# e5 S3776, cognitive complexity: a function that ports one routine of an
#    original executable stays one function, so it can be read beside the
#    disassembly address by address.
# e6 S6861, mutable exports: Skull Cracker's game state is module globals,
#    mirroring SC.EXE's, read by the other modules through live bindings.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S7758
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S3735
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*
sonar.issue.ignore.multicriteria.e4.ruleKey=typescript:S7767
sonar.issue.ignore.multicriteria.e4.resourceKey=**/*
sonar.issue.ignore.multicriteria.e5.ruleKey=typescript:S3776
sonar.issue.ignore.multicriteria.e5.resourceKey=**/*
sonar.issue.ignore.multicriteria.e6.ruleKey=typescript:S6861
sonar.issue.ignore.multicriteria.e6.resourceKey=**/*
