<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Speedrun - Titanic - Adventure Out Of Time RE</title>
    <!-- Unlisted on purpose: nothing links here, it is not in the top bar, and
         search engines are told to leave it alone. It is a workbench for tuning
         a run sheet, reached by typing the URL, which is the right amount of
         hidden for a tool rather than a feature. -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- No nightdive.mov here: this page is reloaded to get a clean game far
         more often than it is opened to play one, and seven seconds of film and
         an ownership question in front of every reboot is the whole cost of
         tuning a route. Read by taoot/src/main.ts (skipsIntro); the play page has no
         such tag and still plays it. The sheet's own `intro()` verb becomes a
         no-op here, which it already handles — it returns the moment there is
         no intro on screen. -->
    <meta name="skip-intro" content="1" />
    <!-- The Details column is part of this page, not something to ask for: the
         workbench is a debugging tool and the log is how a run is read. So it is
         up from the first paint and X does not take it away (taoot/src/main.ts
         detailsAlways). The play page keeps the toggle — there, 161 variable
         names are an answer to a question the player did not ask. -->
    <meta name="details-always" content="1" />
    <!-- English, always: a route is a sequence of clicks and bevels in ONE
         edition's data, so there is no picker here and the game's own language
         chooser never opens (taoot/src/main.ts pinnedEdition). -->
    <meta name="edition" content="en" />
    <!-- where the site root is from this page, for URLs built in TS (site/src/site.ts) -->
    <meta name="site-root" content="../" />
    <link rel="icon" type="image/png" href="/taoot-mark.png" />
    <link rel="stylesheet" href="/src/theme.css" />
    <!-- The saved-games dialog, which is the engine's
         (engine/src/web/save-browser.css) because the module that drives it is,
         and because BOTH of this game's pages that carry the dialog had their
         own copy of it. Through a sheet of this game's rather than linked
         directly: a bare package specifier is a thing Vite resolves in CSS and
         a `<link href>` into another workspace package is not. -->
    <link rel="stylesheet" href="/src/saves.css" />
    <!-- The workbench panel, which is the engine's
         (engine/src/web/speedrun/panel.css) because the modules that drive it are.
         Through a sheet of this game's rather than linked directly: a bare
         package specifier is a thing Vite resolves in CSS and a `<link href>`
         into another workspace package is not. -->
    <link rel="stylesheet" href="/src/speedrun.css" />
    <style>
      /*
       * The game page. Nothing introduces it and nothing asks anything of you:
       * arriving here IS the decision — the welcome and the Play button are the
       * front page (index.html), and this page settles a language and cold
       * boots. The shared sheet (site/src/theme.css) carries the palette, the topbar
       * and the controls; what is left here is the one thing only this page has
       * — a 512x384 framebuffer and the bars that sit under it.
       *
       * The rule this page is built on: nothing beside the canvas may be
       * brighter than the canvas. The game draws in its own 1996 palette and
       * the page's job is to be the dark water around the porthole, so the
       * chrome here is hairlines and dim text, and the only lit thing on the
       * screen is the screen.
       */


      /* Fullscreen: letterbox the 4:3 screen inside a black field. The stage
         (not the canvas) is fullscreened so the minimap overlay comes along and
         the bar colour stays ours. The rim and its glow come off here — at
         fullscreen the game IS the porthole and does not need a frame drawn
         around it. */
      #stage:fullscreen {
        display: grid;
        grid-template-areas: "screen";
        place-items: center;
        width: 100vw;
        height: 100vh;
        margin: 0;
        background: #000;
      }
      #stage:fullscreen #screen {
        grid-area: screen;
        width: min(100vw, calc(100vh * 4 / 3));
        height: min(100vh, calc(100vw * 3 / 4));
        max-width: none;
        border: none;
        border-radius: 0;
        box-shadow: none;
      }
      /* keep the map overlay pinned to the SCREEN's corner, not the viewport's,
         by sharing the screen's grid cell instead of #stage's padding box —
         `start`, matching the left it takes at any other size (below) */
      #stage:fullscreen #minimap {
        grid-area: screen;
        position: static;
        justify-self: start;
        align-self: start;
        margin: 10px;
      }

      /* The waiting-on-the-network mark. Ice, like the preload bar, because it
         is the live thing on the screen; small, because it reports a wait and
         does not ask to be looked at. No words: it sits over 1996 artwork, and a
         spinner needs no translating.

         The bottom right, alone: the input display took that corner for a while
         and this had to be given a z-index to stay visible under it. Both are
         back in corners of their own. */
      /* The plate is not decoration: the frame underneath is whatever the game
         last drew, which is as often a white flat as it is black, so the mark
         carries its own ground the way the minimap does. */
      #netbusy {
        position: absolute;
        right: 12px;
        bottom: 12px;
        width: 26px;
        height: 26px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--hull-400);
        border-radius: 50%;
        background: rgba(0, 6, 15, 0.72);
        box-shadow: 0 6px 22px -8px rgba(0, 0, 0, 0.9);
        pointer-events: none;
      }
      #netbusy span {
        display: block;
        width: 14px;
        height: 14px;
        box-sizing: border-box;
        border: 2px solid rgba(255, 255, 255, 0.22);
        border-top-color: var(--ice-400);
        border-radius: 50%;
        animation: netspin 700ms linear infinite;
      }
      /* Not redundant with the UA sheet: the `display: flex` above beats
         `[hidden] { display: none }`, so `netbusy.hidden = true` (taoot/src/main.ts,
         every time the last fetch lands) took nothing off the screen and the
         spinner turned for the whole session. The show/hide logic was never
         visible — only its `false` case was. */
      #netbusy[hidden] {
        display: none;
      }
      @keyframes netspin {
        to {
          transform: rotate(360deg);
        }
      }
      /* A reader who has asked for less motion still needs to know it is
         waiting, so the mark stays and breathes instead of turning. */
      @media (prefers-reduced-motion: reduce) {
        #netbusy span {
          animation: netpulse 1.4s ease-in-out infinite;
          border-color: var(--ice-400);
        }
        @keyframes netpulse {
          50% {
            opacity: 0.25;
          }
        }
      }
      /* same corner trick as the minimap's, so it tracks the SCREEN fullscreen */
      #stage:fullscreen #netbusy {
        grid-area: screen;
        position: static;
        justify-self: end;
        align-self: end;
        margin: 12px;
      }


      /* Top LEFT here, where the play page has it top right: that corner is the
         input display's on this page. Both are drawn OVER the room for whoever
         is watching, and the map is the one that is stopped on and read, so it
         takes the corner an eye goes to first. */
      #minimap {
        position: absolute;
        left: 10px;
        top: 10px;
        image-rendering: pixelated;
        border: 1px solid var(--hull-400);
        border-radius: 2px;
        background: rgba(0, 6, 15, 0.72);
        box-shadow: 0 6px 22px -8px rgba(0, 0, 0, 0.9);
        display: none;
        width: 180px;
      }

      /* The brightness presets: three segments rather than a slider, because a
         slider is the wrong control for a thumb — this started as one and a
         phone could not hit it. Three targets a finger can land on, each a
         whole tap wide, and no dragging.

         Styled down like everything else here: the rule this page is built on
         is that nothing beside the canvas may be brighter than the canvas, so
         the chosen segment is a brass hairline and a lift in text colour, not a
         filled block. The radios themselves are hidden — they carry the state
         and the keyboard semantics (a radio group is one arrow-key stop, which
         is what this is), the labels carry the looks. */
      .seg {
        display: inline-flex;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
      }
      .seg label {
        margin: 0;
        cursor: pointer;
        /* 44px is the tap target a finger wants, and padding alone did not get
           there (measured 35 at this font size) — so the height is asked for and
           the text centred in it. */
        min-height: 44px;
        display: flex;
        align-items: center;
        padding: 0 0.75rem;
        font-size: 0.78rem;
        color: var(--text-mute);
        border-left: 1px solid var(--border);
      }
      .seg label:first-child {
        border-left: 0;
      }
      .seg input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }
      .seg label:hover {
        color: var(--text-dim);
      }
      .seg input:checked + span {
        color: var(--brass-500, var(--brass-700));
      }
      .seg label:has(input:checked) {
        background: rgba(184, 120, 36, 0.1);
        box-shadow: inset 0 -2px 0 var(--brass-700);
      }
      /* the focus ring has to be visible even though the input is not */
      .seg label:has(input:focus-visible) {
        outline: 1px solid var(--ice-400);
        outline-offset: -1px;
      }


      /* ---- where the game says where you are, and what it is doing ----
         Both live in #details at the bottom of the bars, and both are off until
         X is pressed (taoot/src/main.ts): where you are standing and a script log are
         answers to questions the player has not asked, and the rule this page is
         built on is that the only lit thing on the screen is the screen. */

      #hud {
        font-size: 0.85rem;
        color: var(--text-dim);
        min-height: 1.2em;
        text-align: center;
        padding: 0 1rem;
      }

      /* ---- what stands here until the screen does (taoot/src/main.ts) ----
         Held only while the files are being found and read, and left up for
         good when there are none — so it has to read as both "starting" and
         "this is as far as it gets". */

      /* The boot text says "starting" — in the reader's language or not at all.
         The pages carry their English inline, and a catalogue arrives over a
         dynamic import a beat later (site/src/locales/index.ts), so a German reader was
         reading "Starting" for ~200 ms first. Hidden, not undrawn: it keeps its
         space, so nothing moves when the words arrive. `body.spoken` is set by
         main.ts's boot() the moment installI18n has had its say, which for an
         English reader is the same tick — nothing is fetched in that case. */
      #booting {
        visibility: hidden;
        padding: 1.2rem clamp(0.9rem, 4vw, 2rem) 3rem;
        margin-top: 1.4rem;
        text-align: center;
        width: 100%;
        max-width: 54rem;
      }
      body.spoken #booting {
        visibility: visible;
      }
      #booting .intro {
        font-size: 0.95rem;
        color: var(--text-dim);
        max-width: 40rem;
        margin: 0 auto;
        line-height: 1.6;
      }
      #booting .intro .sub {
        display: block;
        margin-top: 0.7rem;
        font-size: 0.82rem;
        color: var(--text-mute);
      }
      /* The preload bar: ice, because it is the live thing on the page — brass is
         for what has changed or commits. A hairline track and a 3px fill; the
         numbers under it are mono, being read off the wire. */
      #preload {
        margin: 1.4rem auto 0;
        width: 22rem;
        max-width: 80%;
      }
      #preloadTrack {
        height: 3px;
        background: var(--inset);
        border: 1px solid var(--border);
        border-radius: 999px;
        overflow: hidden;
      }
      #preloadFill {
        height: 100%;
        width: 0;
        background: linear-gradient(to right, var(--ice-600), var(--ice-400));
        transition: width 140ms linear;
      }
      #preloadNum {
        margin-top: 0.4rem;
        font-family: var(--font-mono);
        font-size: 0.72rem;
        color: var(--text-mute);
        text-align: center;
      }

      /* ---- the saved-games dialog (engine/src/web/save-browser.ts) ----
         The play page's dialog, duplicated here as the rest of that page is.
         The workbench's own panel — the legend behind the ? button — used to
         borrow these same class rules and does not any more: its presentation
         is `#srlegend` in engine/src/web/speedrun/panel.css, by id, because a
         panel that depended on the page happening to define a `.modal` class
         renders inline and permanently open on the page that does not (Dust's
    </style>
  </head>
  <body class="deep">
    <header class="topbar">
      <a class="brand" href="../" title="RE — reverse-engineered: a best-effort re-implementation of the DreamFactory engine, not the original 1996 release" data-i18n-attr="title:site.brandTitle">
        <img class="brand-mark" src="/taoot-mark.png" alt="" width="30" height="30" />
        <!-- The bar names the PAGE here, not the product, and it is the only
             thing on screen that does: the workbench is the play page's markup
             with a panel beside it, so a bar reading "Adventure Out Of Time RE"
             said nothing about which of the game's four pages you had open.
             Dust's workbench says the same of itself.

             Untranslated, deliberately, and it is the one slot where that is
             already the rule — the brand is this port's name for itself and
             stays put in all six languages (site/src/locales/en.ts). It holds
             here for a second reason too: the panel under it has no translated
             word in it at all (the verbs, the legend, the splits table), and
             this page is outside the set the topbar rule is tested over
             (site/tests/locales.ts PAGES). One translated label above an English
             tool would be the odd thing, not this. -->
        <span class="brand-text">
          <b>Titanic</b>
          <span>Speedrun workbench</span>
        </span>
      </a>
      <nav class="topnav">
        <a href="../play/" class="here" data-i18n="site.navPlay">Play</a>
        <a href="../collection/" data-i18n="site.navCollection">Collection</a>
        <a href="../../" title="dreamREfactory — the engine, and the other two games">dreamREfactory</a>
        <a href="../../docs/" data-i18n="site.navDocs">Docs</a>
        <a href="https://github.com/dhobi/dreamrefactory" data-i18n="site.navSource">Source</a>
      </nav>
    </header>


    <!-- `position: fixed`, so where it sits in the markup decides nothing about
         where it draws. It is up here, out of #srlayout, only because that
         wrapper is a COLUMN box below and a modal does not belong in a column. -->

    <div id="saveModal" class="modal">
      <div class="modal-box">
        <div class="modal-head">
          <span id="saveModalTitle">Saved Games</span>
          <button id="saveModalClose" data-i18n-attr="title:play.savesClose" title="Close">✕</button>
        </div>
        <div id="saveList" class="save-list"></div>
        <div class="modal-foot">
          <div id="saveNewRow" class="save-newrow">
            <input id="saveNameInput" type="text" data-i18n-attr="placeholder:play.savesNamePlaceholder" placeholder="save name" />
            <button id="saveConfirmBtn" data-i18n="play.savesSave">Save</button>
          </div>
          <div>
            <button id="saveUploadBtn" data-i18n="play.savesUpload">⬆ Upload .ti</button>
            <input id="saveUploadInput" type="file" accept=".ti" />
          </div>
        </div>
      </div>
    </div>

    <!-- The game, the sheet and the X pane, in that order. One column on a
         narrow window, and beside each other as far as the window has room for
         — see #srlayout in the stylesheet. -->
    <div id="srlayout">
      <div id="srgame">
    <div id="booting">
      <h1 data-i18n="play.h1">Starting</h1>
      <div class="intro">
        <span data-i18n="play.intro">Loading the game's files…</span>
        <span class="sub" data-i18n-html="play.introSub"
          >Looking in the <code>gamefiles/</code> directory</span
        >
      </div>

      <!-- the preload bar (taoot/src/main.ts showPreload): bytes as they land, so the
           wait in front of the game is a wait you can watch. Numbers only —
           there is nothing here for the catalogue to translate. -->
      <div id="preload" hidden>
        <div id="preloadTrack"><div id="preloadFill"></div></div>
        <div id="preloadNum"></div>
      </div>
    </div>

    <div id="stage" style="display: none">
      <canvas id="screen" width="512" height="384"></canvas>
      <canvas id="minimap"></canvas>
      <!-- The game is waiting on the network. Nothing draws during a fetch —
           the frame loop has no new frame to present — so on a slow link the
           canvas simply holds whatever it had, and a room change reads as a
           hang at whatever the last frame happened to be: a white flat, black,
           a half-finished fade. Raised by taoot/src/main.ts off FileStore's in-flight
           count, and only once the wait is long enough to be felt. -->
      <div id="netbusy" hidden aria-hidden="true"><span></span></div>
    </div>

      <!-- How big the picture is, in whole multiples of the 512x384 framebuffer
           (taoot/src/speedrun-widths.ts). Not the bar of settings the note below
           refuses: this is the picture's answer to the grips that set every
           other column's width, and it is the one width that decides whether
           the row fits three columns at all — so unlike a grip it has to be
           reachable in the STACKED layout, which is exactly where a reader with
           a 1280 laptop is sitting when they want it. The page's own three-way
           control, the same one the brightness presets use. -->
      <span class="seg" id="srscale" role="group" title="How big the picture is drawn — whole multiples of the game's own 512x384, because a fraction of a pixel is not a pixel">
        <label
          ><input type="radio" name="picture" value="1" />
          <span>1x</span></label
        >
        <label
          ><input type="radio" name="picture" value="2" checked />
          <span>2x</span></label
        >
        <label
          ><input type="radio" name="picture" value="3" />
          <span>3x</span></label
        >
      </span>

      <!-- No bar of settings under the screen here. The play page's is
           fullscreen, a bug button, the swipe options and the
           picture/brightness/low-memory rows — questions about how the game
           should look and feel to a person playing it, and this page is a
           workbench where a route is timed. Its own controls are the ones
           taoot/src/speedrun-page.ts builds in #srpanel beside. taoot/src/main.ts runs the
           game on both pages and finds none of the play page's elements here,
           which it is written to tolerate. -->
      </div>
      <!-- /#srgame -->


    <!-- The two panels go here: the Timer and the sheet, built by the engine
         (engine/src/web/speedrun/panel.ts) because the modules that drive them are.
         The SLOT is the page's, though, and that is the point of it — what order
         the columns start in and what else shares the row are facts about this
         page, and they stay where a reader of this page can see them: the game
         above, the panels here, the X pane below. -->
    <div id="srpanelslot"></div>



      <!-- Always here, unlike the play page's copy of it: no `hidden`, so the
           column is up from the first paint rather than from whenever the boot
           gets round to un-hiding it, and X cannot take it down (the
           `details-always` meta in the head).

           A column of #srlayout, in flow, and the LAST one: after the game and
           after the sheet, whether the three are side by side or stacked. It
           used to be moved into a fixed rail at the right edge on a wide window
           (#249) — nothing moves it now, the row wraps instead. -->
      <div id="details">
        <h2 data-i18n="play.debugHeading">Details</h2>
        <div id="hud"></div>
        <!-- what the pane can be asked for beyond the log. `state` starts ON
             here and off on the play page, which is the same rule as the column
             itself: this page has no players to spare 161 variable names from.
             Still a checkbox, and still remembered — turn it off and it stays
             off. -->
        <div id="dbgBar">
          <label data-i18n-attr="title:play.debugStateTitle" title="Every script global, and the six the game's own debug readout names"
            ><input type="checkbox" id="dbgStateOn" />
            <span data-i18n="play.debugState">state</span></label
          >
          <label data-i18n-attr="title:play.debugInputsTitle" title="Every press and click, what it hit, and what it did — in the log, so a report carries it"
            ><input type="checkbox" id="dbgInputsOn" />
            <span data-i18n="play.debugInputs">inputs</span></label
          >
          <button id="dbgCopy" data-i18n="play.debugCopy" data-i18n-attr="title:play.debugCopyTitle" title="Copy the state and the whole log, to attach to a bug report">⧉ Copy details</button>
          <span id="dbgNote" class="note"></span>
        </div>
        <pre id="scriptlog"></pre>
        <div id="dbgState" hidden>
          <div id="dbgSpine"></div>
          <div id="dbgTools">
            <input id="dbgFilter" type="search"
              data-i18n-attr="placeholder:play.debugFilter,title:play.debugFilterTitle"
              placeholder="filter" title="One or more terms, | or , apart: hrs|min|sec — matched against a variable's name or a row's type (prop, actor)" />
            <label data-i18n-attr="title:play.debugAllTitle" title="Every global, not just the ones that have just moved"
              ><input type="checkbox" id="dbgAll" />
              <span data-i18n="play.debugAll">all</span></label
            >
          </div>
          <div id="dbgRows"></div>
        </div>
      </div>
    </div>
    <!-- /#srlayout -->

    <script type="module" src="/src/main.ts"></script>
    <script type="module" src="/src/speedrun-page.ts"></script>
  </body>
</html>
