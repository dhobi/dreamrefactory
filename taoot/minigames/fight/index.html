<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="minigames.fightDoc">
      A fist fight with Vlad — Titanic - Adventure Out Of Time RE
    </title>
    <!-- where the site root is from this page, for URLs built in TS (site/src/site.ts) -->
    <meta name="site-root" content="../../" />
    <link rel="icon" type="image/png" href="/taoot-mark.png" />
    <link rel="stylesheet" href="/src/theme.css" />
    <link rel="stylesheet" href="/minigames/minigame.css" />
  </head>
  <body class="deep">
    <header class="topbar">
      <a
        class="brand"
        href="../../"
        title="RE — reverse-engineered: a best-effort re-implementation of the DreamFactory engine, not the original 1996 release"
        data-i18n-attr="title:site.brandTitle"
      >
        <img class="brand-mark" src="/taoot-mark.png" alt="" width="30" height="30" />
        <span class="brand-text">
          <b>Titanic</b>
          <span>Adventure Out Of Time RE</span>
        </span>
      </a>
      <nav class="topnav">
        <a href="../../play/" data-i18n="site.navPlay">Play</a>
        <a href="../../minigames/" class="here" data-i18n="site.navMinigames">Minigames</a>
        <a href="../../collection/" data-i18n="site.navCollection">Collection</a>
        <a href="../../../" title="dreamREfactory — the engine, and the other two games">dreamREfactory</a>
        <a href="../../../docs/" data-i18n="site.navDocs">Docs</a>
        <a href="https://github.com/dhobi/dreamrefactory" data-i18n="site.navSource">Source</a>
      </nav>
    </header>
    <main class="minigame">
      <h1 data-i18n="minigames.fight">A fist fight with Vlad</h1>
      <p class="sub" data-i18n="minigames.fightSub">Vlad in the hold. One bout, and it settles it.</p>
      <!-- the page holds until this is pressed: a trusted gesture for the
           audio, and a start the player is actually looking at. Fencing has
           no such button because its own buttonbar carries a START. -->
      <button id="begin" class="begin" type="button" hidden data-i18n="minigames.fightBegin">Put your fists up</button>
      <canvas id="screen" width="512" height="384"></canvas>
      <p id="status" class="status" data-i18n="minigames.loading">loading…</p>
      <p class="leave"><a href="../" data-i18n="minigames.back">← All minigames</a></p>
    </main>
    <script type="module" src="/minigames/src/fight-page.ts"></script>
  </body>
</html>
