      <a
        class="brand"
        href="../../"
        title="RE — reverse-engineered: a best-effort re-implementation of the DreamFactory engine, not the original 1996 release"
        data-i18n-attr="title:site.brandTitle"
      >
        <img class="brand-mark" src="/taoot-mark.png" alt="" width="30" height="30" />
        <span class="brand-text">
          <b>Titanic</b>
          <span>Adventure Out Of Time RE</span>
        </span>
      </a>
      <nav class="topnav">
        <a href="../../play/" class="playway" data-i18n="site.navPlay">Play</a>

    <main class="minigame">
      <h1 data-i18n="minigames.blackjack">Blackjack</h1>
      <p class="sub" data-i18n="minigames.blackjackSub">Buick's table in the smoking room.</p>
      <!-- The disc's own cross-game wink: aboard, the dealer asks whether you met
           at Dust's Hard Drive Saloon, and answering yes deals DUST's card backs
           (BLKJACK.STG/0002 asks it twice while laying the cards out). There is no
           conversation here to answer, so it is offered outright. -->
      <p class="options">
        <span data-i18n="minigames.cards">Cards</span>
        <a href="./" data-i18n="minigames.cardsTitanic">Titanic</a>
        <a href="?deck=dust" data-i18n="minigames.cardsDust">Dust</a>
      </p>
      <!-- the page holds until this is pressed: a trusted gesture for the
           audio, and a start the player is actually looking at. Fencing has
           no such button because its own buttonbar carries a START. -->
      <button id="begin" class="begin" type="button" hidden data-i18n="minigames.blackjackBegin">Deal the first hand</button>
      <canvas id="screen" width="512" height="384"></canvas>
      <p id="status" class="status" data-i18n="minigames.loading">loading…</p>
      <p class="leave"><a href="../" data-i18n="minigames.back">← All minigames</a></p>
    </main>
    <script type="module" src="/minigames/src/blackjack-page.ts"></script>
