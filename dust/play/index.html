<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="robots" content="noindex, nofollow" />
    <!-- where the site's root is from THIS page: one folder up, since the game
         lives in play/ under the welcome page. The build emits relative URLs
         (base "./") and siteUrl resolves the rest. -->
    <meta name="site-root" content="../" />
    <title>Dust: A Tale of the Wired West RE</title>
    <!-- shell:head -->
  </head>
  <body class="booting deep">
    <!--
      The same band Titanic and the front door carry, with this game's own links.
      The two `playway` links are the ways into the game, which
      chrome/src/play-menu.ts folds into one "Play" (Original, Speedrunner), as
      on Titanic's pages.
    -->
    <header class="topbar"></header>

    <div id="stage">
      <!-- The title card and the fuse under it: the whole page until the game is
           running, a band at the top after. A logo that fails to load is removed
           rather than left as a broken frame (`brandFallback` in engine/src/web/page-shell.ts), and
           the page is told so the band closes up: the logo is decoration and the
           experiment is the picture below it. -->
      <div id="curtain">
        <img
          id="brand"
          src="/dust-logo.png"
          alt="Dust: A Tale of the Wired West RE"
        />
        <div id="boot">
          <div id="gauge">
            <progress id="fusevalue" aria-label="booting" max="100" value="0"></progress>
            <div id="fuse" aria-hidden="true">
              <div id="burn" style="width: 0%"><i id="spark"></i></div>
            </div>
            <div id="bootline">
              <span id="bootsay">reading the disc…</span>
              <span id="bootpct">0%</span>
            </div>
          </div>
          <!-- the gesture the AudioContext needs, asked for at the one moment
               when waiting for it costs nothing: see #start in the styles -->
          <div id="startwrap">
            <button id="start" type="button">Start</button>
          </div>
          <!-- The gesture, taught where there is room to say it properly: under
               the Start button, before the picture exists. The strip's version of
               this line has to fit beside two checkboxes and a version number at
               400px, which leaves it about eighteen characters — not enough for the
               half that matters (double-tap is the one thing no one guesses). So
               the full sentence lives here, and only on a device that can swipe. -->
          <p id="touchtip">
            swipe to walk and turn · double-tap for <b>esc</b>
          </p>
        </div>
      </div>
      <div id="frame">
        <canvas id="screen" width="1024" height="768"></canvas>
        <!-- the game is waiting on the network — shown by dust.ts only after the
             wait is long enough to be one (the play page's netbusy, in this
             page's wood) -->
        <div id="netbusy" hidden aria-hidden="true"><span></span></div>
      </div>
    </div>
    <!-- The strip is the CONTROLS and nothing else.

         It used to carry the live readout too — room, scene, view, who is standing
         here, the canvas's backing size — and every one of those was written for a
         question that has since been answered. What is left is the only line on it
         a player needs, and everything the readout said is in the log, one entry
         per move, which is a better shape for it: a trace you can scroll back
         through rather than a number that overwrites itself. -->
    <!--
           The controls, as ROWS UNDER the picture rather than a bar fixed to the
           bottom of the window.

           The fixed strip cost the picture 38px of every window whether anyone
           was reading it or not, put the only thing you can PRESS on this page
           in the least reachable corner of a phone, and ellipsized its own
           sentence to fit. A row can be as tall as it needs to be and the page
           scrolls to it, which is how the play page has always shown this kind
           of thing (taoot/play/index.html: #under, and its .bar rows).
      -->
    <div id="under">
      <div class="bar">
        <button id="fsBtn" type="button" title="Fullscreen (letterboxed 4:3)">
          ⛶ Fullscreen
        </button>
        <!-- what fullscreen does with the display's own shape (engine/src/web/stretch.ts) -->
        <label class="stretchopt" title="In fullscreen, fill the whole display instead of keeping the original 4:3 — the picture is stretched to fit"
          ><input type="checkbox" id="stretchBox" /> <span>stretch to fill</span></label
        >
        <!-- how a move lands: DF.EXE draws every standpoint low-res first and
             the hi-res picture once you have stood still a moment
             (engine/src/web/picture-mode.ts, shared with Titanic's play page) -->
        <label
          class="stretchopt"
          title="The game ships each standpoint twice, sharp and soft, and the original lands every move on the soft one, sharpening it once you have stood still a moment. The other three give every landing the same picture. The movement itself stays soft whichever you pick: no sharp version of the moving frames was ever made."
          ><span>landing</span>
          <select id="pictureMode">
            <option value="original">original</option>
            <option value="sharp">always sharp</option>
            <option value="transition">always transition</option>
            <option value="soft">always soft</option>
          </select></label
        >
        <!-- the menu band tucked away (engine/src/web/tylerhartman.ts) -->
        <label class="stretchopt" title="Tyler Hartman mode"
          ><input type="checkbox" id="thBox" /> <span>TH mode</span></label
        >
        <!-- opens a prefilled GitHub issue and puts the screen on the
               clipboard, which is the only way an image reaches one
               (chrome/src/bug-report.ts, shared with the play page) -->
        <button
          id="bugBtn"
          type="button"
          title="Report something the port gets wrong"
        >
          🪲 Report a bug
        </button>
        <!-- what became of the screenshot, said where the button is -->
        <span id="bugNote" class="note"></span>
        <span
          class="keyhint"
          title="←/→ turn · ↑ walk · c cycles the clut · b opens the boot log"
          ><span class="k">←</span>/<span class="k">→</span> turn
          <span class="k">↑</span> walk <span class="k">c</span> clut
          <span class="k">b</span> for the boot log</span
        >
        <!-- the same line for a phone, which has none of those keys. Swapped by a
             media query rather than by script, because it is a question about the
             POINTER and CSS is what knows the answer without asking. -->
        <span
          class="touchhint"
          title="swipe up to walk, left/right to turn · double-tap for escape"
          >swipe · <span class="k">2-tap</span> esc</span
        >
      </div>
      <div class="bar">
        <!-- Which way a swipe reads. Only a device that can swipe is asked:
             dust/src/main.ts's installSwipeOptions unhides this and remembers both boxes. -->
        <span id="swipeOpts" hidden
          ><label title="a swipe from right to left turns right, not left"
            ><input type="checkbox" id="swipeInvertTurn" /><span class="word"
              >invert</span
            ><span class="k">←/→</span></label
          ><label title="a swipe downwards walks on, not one upwards"
            ><input type="checkbox" id="swipeInvertWalk" /><span class="word"
              >invert</span
            ><span class="k">↑</span></label
          ></span
        >
        <!-- errors read as part of the controls rather than as a status line:
               this is the only place on the page that says anything in words. -->
        <span id="err"></span>
      </div>
    </div>
    <!-- Details, behind b (or x, or the log button): the boot's own account of
         itself, the state list and Copy details — built by
         engine/src/web/details-column.ts, the column Titanic's play page carries. -->
    <div id="details" hidden></div>
    <!-- The ask, in its own element BELOW the controls strip.

         It was a third row of #under first, which was wrong: that strip waits
         for the picture (`body:not(.playing)` hides it), so the link vanished
         on the title card and never appeared at all for somebody who read the
         page and left without pressing Start — which is most of them, and
         exactly who an ask is for.

         An anchor in the markup rather than anything injected, so it is there
         before a script runs and visible to whatever reads the page.
         `/bmc-mark.svg` is root-absolute because Vite rewrites a `public/` path
         the MARKUP names per page depth. -->
    <footer id="foot"></footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
